<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOXCAT TCG 對戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Battle table: a dark playmat in NOXCAT lime + black. Opponent on top, you at the bottom, card info and log on the right (a bottom sheet on phones). */
:root {
  --void: #070806; --mat: #0e100c; --panel: #12140f; --panel2: #191c15;
  --ink: #f2f5ea; --muted: #9ea592; --lime: #b4f01e; --lime-ink: #0d1203; --line: rgba(255,255,255,.1);
  --red: #ff5a4e; --gold: #f5c451;
  --font-mark: "Unbounded", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --w: 88px; --wa: 124px; --wh: 90px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; min-height: 100dvh; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.btn { font-weight: 700; font-size: 14px; cursor: pointer; border-radius: 999px; padding: 9px 18px; border: 1px solid transparent; background: var(--panel2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .12s, background-color .2s, opacity .2s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--lime); color: var(--lime-ink); }
.btn-primary:hover { background: #c6ff3d; }
.btn-ghost { background: rgba(255,255,255,.04); border-color: var(--line); }
.btn-ghost:hover { border-color: rgba(255,255,255,.3); }
.btn-small { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .38; cursor: not-allowed; transform: none; }

/* header */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; background: rgba(7,8,6,.92); border-bottom: 1px solid var(--line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-mark); font-weight: 800; font-size: 13px; letter-spacing: .12em; }
.brand i { width: 26px; height: 26px; border-radius: 7px; background: #8eb943; display: grid; place-items: center; }
.brand em { font-style: normal; color: #8eb943; font-size: 11px; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-left: auto; }
.tabs button { border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--lime); color: var(--lime-ink); font-weight: 700; }
.closer { margin-left: 4px; }

/* lobby */
.lobby { max-width: 980px; margin: 0 auto; padding: 32px 16px 60px; display: grid; gap: 20px; }
.lobby h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); font-weight: 900; line-height: 1.2; }
.lobby > p { margin: 0; color: var(--muted); max-width: 40rem; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; }
.vs-mid { align-self: center; font-family: var(--font-mark); font-weight: 800; font-size: 22px; color: var(--lime); }
.deckbox { border: 1px solid var(--line); border-radius: 20px; background: var(--panel); padding: 18px; display: grid; gap: 12px; align-content: start; }
.deckbox h2 { margin: 0; font-size: 17px; font-weight: 900; }
.deckbox .who { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.deck-faces { display: flex; gap: 6px; min-height: 92px; min-width: 0; align-items: flex-start; }
.deck-faces img { width: 64px; min-width: 0; flex: 0 1 64px; aspect-ratio: 63/88; border-radius: 5px; object-fit: cover; background: #1b1e16; }
.deck-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.chip b { color: var(--ink); font-weight: 700; }
.errs { margin: 0; padding-left: 18px; color: #ffb09f; font-size: 13px; display: grid; gap: 2px; }
.okline { color: var(--lime); font-size: 13px; font-weight: 700; margin: 0; }
.lobby-go { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tip { color: var(--muted); font-size: 13px; margin: 0; }
@media (max-width: 680px) { .vs { grid-template-columns: 1fr; } .vs-mid { justify-self: center; } }
.online { border: 1px solid rgba(180,240,30,.32); border-radius: 20px; background: linear-gradient(180deg, rgba(180,240,30,.06), transparent 70%), var(--panel); padding: 18px; display: grid; gap: 14px; }
.online h2 { margin: 0; font-size: 17px; font-weight: 900; }
.online .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.field input { font: inherit; font-size: 16px; color: var(--ink); background: var(--void); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; width: 11rem; max-width: 100%; }
.field input:focus { outline: 2px solid var(--lime); outline-offset: 1px; }
.field input.codein { text-transform: uppercase; letter-spacing: .2em; width: 8.5rem; font-family: var(--font-mark); font-weight: 600; }
.or { color: var(--muted); font-size: 12px; padding-bottom: 10px; }
.roomcode { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.roomcode b { font-family: var(--font-mark); font-weight: 800; font-size: 34px; letter-spacing: .2em; color: var(--lime); line-height: 1; }
.ostate { display: flex; gap: 9px; align-items: center; font-size: 14px; margin: 0; }
.ostate i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.ostate i.on { background: var(--lime); box-shadow: 0 0 0 4px rgba(180,240,30,.16); }
.ostate i.wait { animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .ostate i.wait { animation: none; } }
.owarn { color: #ffb09f; font-size: 13px; margin: 0; }

/* table */
.table { display: grid; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; gap: 12px; padding: 10px 12px 12px; max-width: 1400px; margin: 0 auto; }
.mat { position: relative; border-radius: 24px; border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 6px; min-width: 0; align-content: start;
  background: radial-gradient(40rem 18rem at 50% 50%, rgba(180,240,30,.07), transparent 70%), repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 10px, transparent 10px 20px), var(--mat); }
.side { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "prz act bench piles"; align-items: center; gap: 6px 18px; padding: 4px 6px; }
.a-prz { grid-area: prz; } .a-act { grid-area: act; } .a-bench { grid-area: bench; } .a-piles { grid-area: piles; display: grid; gap: 10px; justify-items: center; }
.side .bench { justify-content: flex-start; }
.side.opp .a-act { align-self: end; } .side.me .a-act { align-self: start; }
.zone-label { font-size: 10.5px; letter-spacing: .14em; color: rgba(242,245,234,.35); text-align: center; margin-top: 3px; }
.bench { display: flex; gap: 8px; justify-content: center; min-height: calc(var(--w) * 88 / 63 + 18px); align-items: flex-start; }
.bench .empty { width: var(--w); aspect-ratio: 63/88; border-radius: 7px; border: 1.5px dashed rgba(255,255,255,.08); }
.front { display: flex; justify-content: center; align-items: center; gap: 18px; min-height: calc(var(--wa) * 88 / 63 + 22px); }
.pile { display: grid; justify-items: center; gap: 2px; }
.piles { display: flex; gap: 8px; justify-content: center; }
.prizes { display: grid; grid-template-columns: repeat(2, 30px); gap: 4px; justify-content: center; }
.prizes i { width: 30px; aspect-ratio: 63/88; border-radius: 3px; background: #1d2a0b center / cover; border: 1px solid rgba(180,240,30,.35); }
.prizes i.gone { opacity: .12; border-style: dashed; background: none; }
.mini { width: 46px; aspect-ratio: 63/88; border-radius: 4px; background: #1b1e16 center / cover; position: relative; border: 1px solid rgba(255,255,255,.1); cursor: pointer; }
.mini b { position: absolute; inset: auto 0 -2px; text-align: center; font-family: var(--font-mark); font-size: 11px; font-weight: 800; text-shadow: 0 1px 4px #000, 0 0 2px #000; }
.handcount { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; justify-content: center; }
.handcount i { width: 22px; aspect-ratio: 63/88; border-radius: 3px; background: #1d2a0b center / cover; margin-left: -14px; border: 1px solid rgba(180,240,30,.25); }
.handcount i:first-child { margin-left: 0; }
.midline { display: grid; grid-template-columns: 112px minmax(0, 1fr) 112px; align-items: center; gap: 10px; padding: 4px 0; border-block: 1px dashed rgba(255,255,255,.07); }
.midline .status-text { text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; text-wrap: balance; }
.midline .status-text b { color: var(--ink); }
.stadium { display: grid; justify-items: center; gap: 2px; }
.endturn { justify-self: center; }

/* cards on the table */
.pc { position: relative; width: var(--w); aspect-ratio: 63/88; border-radius: 7px; cursor: pointer; flex: none; transition: transform .18s, box-shadow .2s, opacity .3s; }
.pc.active { width: var(--wa); }
.pc img { width: 100%; height: 100%; display: block; border-radius: inherit; object-fit: cover; background: #1b1e16; box-shadow: 0 6px 16px rgba(0,0,0,.55); }
.pc .hpbar { position: absolute; left: 6%; right: 6%; bottom: -10px; height: 7px; border-radius: 6px; background: rgba(0,0,0,.75); overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
.pc .hpbar i { display: block; height: 100%; background: var(--lime); border-radius: 6px; transition: width .4s; }
.pc .hpbar i.low { background: var(--red); }
.pc .hp { position: absolute; right: -6px; top: -8px; font-family: var(--font-mark); font-weight: 800; font-size: 12px; background: #0b0c09; border: 1.5px solid var(--lime); color: var(--ink); border-radius: 999px; padding: 1px 7px; box-shadow: 0 2px 8px rgba(0,0,0,.6); }
.pc .hp.low { border-color: var(--red); color: #ffd0cb; }
.pc .pips { position: absolute; left: 4px; bottom: 6px; display: flex; flex-wrap: wrap; gap: 2px; max-width: 92%; }
.pc .pips i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.6); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.pc.active .pips i { width: 16px; height: 16px; }
.pc .tool { position: absolute; left: -6px; top: -8px; font-size: 11px; font-weight: 900; background: #c48cff; color: #0d1203; border-radius: 999px; padding: 1px 7px; }
.pc .sts { position: absolute; left: 50%; transform: translateX(-50%); top: 38%; display: flex; gap: 3px; }
.pc .sts span { font-size: 11px; font-weight: 900; padding: 1px 6px; border-radius: 999px; background: rgba(8,9,7,.86); border: 1px solid; white-space: nowrap; }
.st-poison { color: #c48cff; border-color: #c48cff; } .st-burn { color: #ff7b47; border-color: #ff7b47; }
.st-sleep { color: #8fb8ff; border-color: #8fb8ff; } .st-par { color: #ffd23f; border-color: #ffd23f; } .st-conf { color: #ff8ae6; border-color: #ff8ae6; }
.st-fx { color: var(--lime); border-color: var(--lime); }
.pc.target { box-shadow: 0 0 0 3px var(--lime), 0 0 22px rgba(180,240,30,.65); animation: pulse 1.1s infinite; }
.pc.picked { box-shadow: 0 0 0 3px #fff, 0 0 22px rgba(255,255,255,.6); }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px var(--lime), 0 0 6px rgba(180,240,30,.3); } }
.pc.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-6px) rotate(-2deg); } 40% { transform: translateX(6px) rotate(2deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pc.ko { opacity: 0; transform: scale(.7) rotate(-8deg); }
.pc.glow img { box-shadow: 0 0 0 3px #fff, 0 0 30px rgba(255,255,255,.9); }
.float { position: absolute; left: 50%; top: 28%; transform: translate(-50%, 0); font-family: var(--font-mark); font-weight: 800; font-size: 30px; color: #fff; -webkit-text-stroke: 1.5px #5a0d08; text-shadow: 0 0 14px var(--red), 0 0 4px var(--red), 0 3px 4px #000; pointer-events: none; animation: dmgpop 1.25s ease-out forwards; z-index: 6; white-space: nowrap; }
.float.big { font-size: 40px; text-shadow: 0 0 20px var(--red), 0 0 6px #ffb09f, 0 3px 4px #000; }
@keyframes dmgpop { 0% { transform: translate(-50%, 8px) scale(.4); opacity: 0; } 14% { transform: translate(-50%, -6px) scale(1.35); opacity: 1; } 28% { transform: translate(-50%, 0) scale(1); } 75% { opacity: 1; } 100% { transform: translate(-50%, -46px) scale(.95); opacity: 0; } }
.hurt { position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at 50% 45%, rgba(255,90,78,.15), rgba(255,40,30,.55)); mix-blend-mode: screen; pointer-events: none; animation: hurt .5s ease-out forwards; z-index: 5; }
@keyframes hurt { from { opacity: 1; } to { opacity: 0; } }
.pc.enter { animation: enter .52s cubic-bezier(.2,.8,.3,1.1) both; }
@keyframes enter { 0% { transform: translateY(-34px) scale(1.25); opacity: 0; filter: brightness(2); } 55% { opacity: 1; transform: translateY(4px) scale(.97); filter: brightness(1.3); } 100% { transform: none; filter: none; } }
.side { border-radius: 18px; transition: background-color .4s, box-shadow .4s; }
.side.turn { background: radial-gradient(70% 90% at 30% 50%, rgba(180,240,30,.075), transparent 70%); box-shadow: inset 0 0 0 1px rgba(180,240,30,.22); }
.side.turn .pc.active img { box-shadow: 0 0 0 2px rgba(180,240,30,.85), 0 0 22px rgba(180,240,30,.35), 0 6px 16px rgba(0,0,0,.55); }
/* effect layer */
.ghost { position: fixed; z-index: 46; pointer-events: none; margin: 0; transition: none; will-change: transform; }
.ghost img { box-shadow: 0 0 0 2px var(--tc), 0 0 26px var(--tc); }
.atk-cap { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); white-space: nowrap; font-weight: 900; font-size: 13px; color: var(--ink); background: rgba(7,8,6,.94); border: 1.5px solid var(--tc); box-shadow: 0 0 14px var(--tc); padding: 3px 11px; border-radius: 999px; }
.spark, .ring, .flash, .orb, .ko-tag { position: fixed; z-index: 47; pointer-events: none; border-radius: 50%; transform: translate(-50%, -50%); }
.ring { border: 3px solid; background: transparent; }
.flash { mix-blend-mode: screen; }
.orb { width: 22px; height: 22px; z-index: 48; }
.tint { position: fixed; inset: 0; z-index: 44; pointer-events: none; mix-blend-mode: screen; }
.zap { position: fixed; z-index: 48; pointer-events: none; overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px #ffd23f) drop-shadow(0 0 2px #fff); }
.ko-tag { border-radius: 10px; font-family: var(--font-mark); font-weight: 800; font-size: 24px; letter-spacing: .12em; color: #fff; background: rgba(120,14,8,.9); border: 2px solid var(--red); padding: 4px 16px; box-shadow: 0 0 24px rgba(255,90,78,.6); white-space: nowrap; z-index: 49; }
.opp .pc .hpbar { bottom: auto; top: -10px; }
.opp .pc .hp { top: auto; bottom: -8px; }

/* hand */
.handwrap { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; display: grid; gap: 6px; }
.actionbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 38px; }
.actionbar .prompt { font-size: 13.5px; color: var(--ink); font-weight: 500; margin-right: auto; text-wrap: balance; }
.actionbar .prompt small { color: var(--muted); font-weight: 400; }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 10px 2px 6px; scrollbar-width: thin; min-height: calc(var(--wh) * 88 / 63 + 20px); }
.hand .pc { width: var(--wh); }
.hand .pc.sel { transform: translateY(-10px); box-shadow: 0 0 0 3px var(--lime), 0 10px 24px rgba(0,0,0,.6); }
.hand .pc.dim img { filter: saturate(.5) brightness(.65); }
.hand .pc .can { position: absolute; inset: auto 6px 6px auto; width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); }

/* info panel */
.info { display: grid; gap: 10px; align-content: start; min-width: 0; position: sticky; top: 64px; max-height: calc(100dvh - 76px); overflow: auto; }
.panel { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); padding: 12px; }
.detail { display: grid; gap: 10px; }
.detail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.detail-head h3 { margin: 0; font-size: 15px; font-weight: 900; }
.detail img.face { width: 100%; max-width: 280px; justify-self: center; aspect-ratio: 63/88; border-radius: 10px; display: block; background: #1b1e16; }
.facts { display: flex; flex-wrap: wrap; gap: 5px; }
.moves { display: grid; gap: 8px; }
.mv { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 4px; background: var(--panel2); }
.mv-top { display: flex; align-items: center; gap: 6px; }
.mv-top b { font-weight: 900; font-size: 14.5px; }
.mv-top .dmg { margin-left: auto; font-family: var(--font-mark); font-weight: 800; font-size: 16px; }
.mv p { margin: 0; color: #c3c9b6; font-size: 12.5px; }
.mv .why { color: #ffb09f; font-size: 12px; }
.mv .btn { justify-self: start; }
.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 900; color: #0d1203; background: var(--tc); flex: none; border: 1px solid rgba(0,0,0,.35); }
.abil { color: #ff9a8f; font-size: 12px; font-weight: 900; border: 1px solid #ff9a8f; border-radius: 99px; padding: 0 7px; }
.logbox { max-height: 300px; overflow-y: auto; display: grid; gap: 3px; font-size: 12.5px; color: #c3c9b6; padding-right: 4px; }
.logbox p { margin: 0; }
.logbox .turn { color: var(--lime); font-weight: 700; margin-top: 6px; }
.logbox .dmg { color: #ffb09f; } .logbox .ko { color: var(--red); font-weight: 700; } .logbox .prize { color: var(--gold); font-weight: 700; }
.logbox .win { color: var(--lime); font-weight: 900; } .logbox .heal { color: #a6f0b0; } .logbox .coin { color: #9ec8ff; } .logbox .atk { color: var(--ink); font-weight: 700; }
.logbox .evo { color: #ffd77a; } .logbox .status { color: #ff8ae6; } .logbox .cmd { color: #9fd0ff; }
.panel h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .06em; }
.sheet-close { display: none; }

/* overlays */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(5,6,4,.82); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.modal-box { width: min(760px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 12px; }
.modal-box h3 { margin: 0; font-size: 18px; font-weight: 900; }
.modal-box .sub { margin: 0; color: var(--muted); font-size: 13px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.opt { border: 0; padding: 0; background: none; cursor: pointer; display: grid; gap: 4px; justify-items: center; text-align: center; font-size: 12px; color: var(--muted); border-radius: 10px; }
.opt img { width: 100%; aspect-ratio: 63/88; border-radius: 7px; display: block; object-fit: cover; background: #1b1e16; transition: transform .12s, box-shadow .15s; }
.opt[aria-pressed="true"] img { box-shadow: 0 0 0 3px var(--lime), 0 0 18px rgba(180,240,30,.6); transform: translateY(-3px); }
.opt[disabled] { opacity: .3; cursor: not-allowed; }
.opt.text { border: 1px solid var(--line); padding: 12px; color: var(--ink); font-size: 14px; }
.opt.text[aria-pressed="true"] { border-color: var(--lime); }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.modal-foot .count { margin-right: auto; color: var(--muted); font-size: 13px; }
.banner { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 35; pointer-events: none; font-weight: 900; font-size: clamp(26px, 5vw, 46px); padding: 12px 34px; border-radius: 999px; background: rgba(7,8,6,.86); border: 1px solid var(--line); text-shadow: 0 0 18px rgba(180,240,30,.5); animation: pop .9s ease-out forwards; white-space: nowrap; }
.banner.small { font-size: 20px; padding: 10px 24px; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.9); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.coinfx { position: fixed; left: 50%; top: 40%; z-index: 55; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 8px; pointer-events: none; }
.coinfx i { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: 18px; color: #0d1203; background: radial-gradient(circle at 35% 30%, #f6ffd2, var(--lime) 55%, #6f9a10); box-shadow: 0 0 30px rgba(180,240,30,.6); animation: flip .55s ease-out; }
.coinfx i.tails { background: radial-gradient(circle at 35% 30%, #eee, #9aa093 55%, #4a4f44); box-shadow: 0 0 20px rgba(255,255,255,.3); }
.coinfx span { font-size: 13px; background: rgba(7,8,6,.86); padding: 3px 12px; border-radius: 99px; border: 1px solid var(--line); }
@keyframes flip { 0% { transform: rotateX(0) scale(.6); } 70% { transform: rotateX(1080deg) scale(1.1); } 100% { transform: rotateX(1080deg) scale(1); } }
.played { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 52; width: 190px; pointer-events: none; animation: pop .9s ease-out forwards; }
.played img { width: 100%; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.7); display: block; }
.result { text-align: center; justify-items: center; }
.result h3 { font-size: 34px; }
.result .big { font-family: var(--font-mark); font-weight: 800; font-size: 13px; letter-spacing: .3em; color: var(--lime); }

/* deck builder */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; align-items: start; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
.filters button { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
.filters button[aria-pressed="true"] { border-color: var(--lime); color: var(--ink); background: rgba(180,240,30,.1); }
.coll { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.cc { display: grid; gap: 4px; }
.cc .face { position: relative; cursor: zoom-in; }
.cc img { width: 100%; aspect-ratio: 63/88; border-radius: 7px; display: block; background: #1b1e16; object-fit: cover; }
.cc .own { position: absolute; right: 4px; top: 4px; background: rgba(8,9,7,.85); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; font-size: 11px; font-weight: 700; }
.cc .in { position: absolute; left: 4px; top: 4px; background: var(--lime); color: var(--lime-ink); border-radius: 99px; padding: 0 7px; font-size: 11px; font-weight: 900; }
.stepper { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; text-align: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.stepper button { border: 0; background: rgba(255,255,255,.05); height: 30px; cursor: pointer; font-size: 17px; font-weight: 700; }
.stepper button:disabled { opacity: .3; cursor: not-allowed; }
.stepper span { font-family: var(--font-mark); font-weight: 600; font-size: 13px; }
.decklist { position: sticky; top: 70px; display: grid; gap: 10px; max-height: calc(100dvh - 90px); overflow: auto; }
.decklist h3 { margin: 0; font-size: 16px; font-weight: 900; display: flex; align-items: baseline; gap: 8px; }
.decklist h3 em { font-style: normal; font-family: var(--font-mark); font-size: 15px; margin-left: auto; }
.dl-group h4 { margin: 8px 0 4px; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .08em; }
.dl-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 3px 0; font-size: 13.5px; }
.dl-row button { border: 1px solid var(--line); background: none; border-radius: 99px; width: 24px; height: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
.dl-row b { font-family: var(--font-mark); font-size: 12px; }
.bar { height: 6px; border-radius: 6px; background: #1e2119; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lime); transition: width .3s; }
.empty-note { border: 1px dashed var(--line); border-radius: 16px; padding: 16px; color: var(--muted); font-size: 13.5px; }

@media (max-width: 1000px) {
  .table { grid-template-columns: minmax(0, 1fr); padding: 6px 6px 10px; }
  .info { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 40; max-height: 78dvh; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateY(105%); transition: transform .25s; box-shadow: 0 -20px 50px rgba(0,0,0,.6); }
  .info.open { transform: none; }
  .info .panel { border: 0; padding: 4px; background: none; }
  .sheet-close { display: inline-flex; }
  .info .logwrap { display: none; }
  .info.showlog .logwrap { display: block; }
  .info.showlog .detailwrap { display: none; }
  .builder { grid-template-columns: minmax(0, 1fr); }
  .decklist { position: static; max-height: none; }
}
@media (max-width: 700px) {
  :root { --w: 52px; --wa: 74px; --wh: 60px; }
  .handwrap { position: sticky; bottom: 0; z-index: 20; margin: 4px -6px -8px; padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px); background: rgba(14,16,12,.96); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.6); }
  .hand { padding-top: 8px; }
  .actionbar { min-height: 32px; gap: 6px; }
  .actionbar .prompt { font-size: 12.5px; }
  .midline { padding: 2px 0; }
  .midline .status-text { font-size: 12px; }
  .front { min-height: calc(var(--wa) * 88 / 63 + 16px); gap: 8px; }
  .bench { min-height: calc(var(--w) * 88 / 63 + 12px); }
  .mat { gap: 2px; }
  .midline { grid-template-columns: 64px minmax(0, 1fr) 64px; gap: 4px; }
  .side { grid-template-columns: 64px minmax(0, 1fr) 64px; gap: 4px; padding: 2px 0; }
  .side.me { grid-template-areas: "prz act piles" "bench bench bench"; }
  .side.opp { grid-template-areas: "bench bench bench" "prz act piles"; }
  .side .bench { justify-content: center; }
  .a-act { justify-self: center; }
  .prizes { grid-template-columns: repeat(2, 22px); gap: 3px; }
  .prizes i { width: 22px; }
  .mini { width: 34px; }
  .piles { flex-direction: column; align-items: center; gap: 4px; }
  .bench { gap: 4px; }
  .mat { padding: 8px 6px; border-radius: 16px; }
  .pc .hp { font-size: 10px; padding: 0 5px; }
  .pc .pips i { width: 9px; height: 9px; border-width: 1px; }
  .pc.active .pips i { width: 12px; height: 12px; }
  .pc .sts span { font-size: 9.5px; padding: 0 4px; }
  .zone-label { font-size: 9px; letter-spacing: .08em; }
  .top { padding-inline: 10px; gap: 8px; }
  .brand span { display: none; }
  .coll { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .pc, .btn, .info { transition: none; } .pc.target { animation: none; } .coinfx i { animation: none; } .pc.enter { animation: none; } .float { animation-duration: 1.6s; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i><svg width="18" height="17" viewBox="0 0 107 97" aria-hidden="true"><path fill="#1f1c1b" d="M3.9 14.8Q2.2 19 2.2 22.2Q2.2 25 3.4 33.6Q4.6 42 3.4 45.7Q.5 57 .1 66.8Q.2 72 .7 74.8Q2.1 81 4.9 87.7Q8.3 92.3 12 94.8Q16.4 96.2 51.5 96.6Q86.7 96.2 91.1 94.9Q96.5 91.8 101.3 85.8Q105.7 72.8 106.1 63.2Q105.1 54.2 102.4 47Q97.9 39.5 92.6 33.6Q86.5 28.9 80.2 25.2Q73.5 22.4 65.5 20Q58.1 14.1 53.1 7.2Q47 1.2 43.3 0Q41 .6 37.8 6.4Q36.3 13.8 35.2 18.8Q29.1 21 19 19.8Q12.6 15.9 5.1 14.2Z"/><path fill="#fff" d="M14.8 41.4Q19 40 21.8 42.9Q25.5 51.6 23.1 59.3Q18.8 59.2 14.3 53.5Q12.9 47 14.8 41.4ZM35.9 33.5Q40 32.9 42.1 35.1Q46.1 45.9 44.1 51.6Q39.8 52 35 46.2Q33.6 38.9 35.9 33.5Z"/></svg></i><span>NOXCAT</span> <em>對戰</em></div>
  <div class="tabs" role="tablist" aria-label="切換">
    <button role="tab" id="tab-battle" aria-selected="true">對戰</button>
    <button role="tab" id="tab-deck" aria-selected="false">組牌</button>
  </div>
  <button class="btn btn-ghost btn-small closer" id="btn-close" hidden>回卡包</button>
</header>

<main>
  <section id="v-lobby" class="lobby">
    <h1>拿你抽到的卡來對戰。</h1>
    <p>牌組只能用你在卡包抽到的卡，8 種基本資源不限張數。牌組剛好 40 張、至少 1 張基礎 NOXCAT 就能開打。可以跟電腦打，也可以開房間跟朋友連線對戰。</p>
    <div class="vs">
      <div class="deckbox" id="my-deckbox"></div>
      <div class="vs-mid">VS</div>
      <div class="deckbox" id="ai-deckbox"></div>
    </div>
    <div class="lobby-go">
      <button class="btn btn-primary" id="btn-start">跟電腦對戰</button>
      <button class="btn btn-ghost" id="btn-reroll">換一個電腦對手</button>
      <p class="tip">遊戲規則在卡包網站的「規則」頁。</p>
    </div>
    <div class="online" id="online-box" aria-live="polite"></div>
  </section>

  <section id="v-game" hidden>
    <div class="table">
      <div class="mat" id="mat">
        <div class="side opp" id="opp-zone"></div>
        <div class="midline">
          <div class="stadium" id="stadium"></div>
          <div class="status-text" id="status-text"></div>
          <button class="btn btn-primary btn-small endturn" id="btn-end">結束回合</button>
        </div>
        <div class="side me" id="me-zone"></div>
        <div class="handwrap">
          <div class="actionbar" id="actionbar"></div>
          <div class="hand" id="hand" aria-label="你的手牌"></div>
        </div>
      </div>
      <aside class="info" id="info">
        <div class="panel detailwrap"><div class="detail" id="detail"></div></div>
        <div class="panel logwrap"><h4>對戰紀錄</h4><div class="logbox" id="log" aria-live="polite"></div></div>
      </aside>
    </div>
  </section>

  <section id="v-deck" hidden>
    <div class="builder">
      <div>
        <div class="filters" id="filters"></div>
        <div class="coll" id="coll"></div>
      </div>
      <aside class="panel decklist" id="decklist"></aside>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-box" id="modal-box"></div></div>
<div id="fx"></div>

<script src="tcg-core.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
